
<!DOCTYPE html>
<html lang="rw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NASHO HEALTH CENTER | Discussions</title>

  <script src="https://unpkg.com/lucide@latest"></script>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --primary: #059669;
      --primary-dark: #047857;
      --secondary: #2563eb;
      --bg: #f1f5f9;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --danger: #dc2626;
      --shadow: 0 10px 30px rgba(15, 23, 42, 0.06);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 18px;
      font-family: "Inter", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .container {
      width: 100%;
      max-width: 850px;
      margin: 0 auto;
      display: grid;
      gap: 18px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 24px;
      box-shadow: var(--shadow);
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .brand-tag {
      color: var(--primary);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    h1 {
      font-size: clamp(22px, 5vw, 32px);
      margin: 8px 0;
      color: #065f46;
      line-height: 1.2;
    }

    h3 {
      margin-top: 0;
      font-size: 18px;
    }

    .subtitle {
      color: var(--muted);
      margin: 0;
      font-size: 14px;
    }

    .language-box {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 160px;
    }

    .language-box label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .language-box select {
      width: 100%;
      background: white;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      outline: none;
      color: var(--text);
      cursor: pointer;
    }

    .language-box select:focus,
    input:focus,
    textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.1);
      outline: none;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 7px;
      margin-bottom: 16px;
    }

    label {
      font-size: 13px;
      font-weight: 700;
    }

    input,
    textarea {
      width: 100%;
      padding: 12px 13px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      background: #fff;
      color: var(--text);
      font-size: 14px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    textarea {
      resize: vertical;
      min-height: 100px;
    }

    .btn {
      border: none;
      border-radius: 10px;
      padding: 11px 17px;
      color: white;
      background: var(--primary);
      font-size: 13px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform 0.2s, background 0.2s;
    }

    .btn:hover {
      background: var(--primary-dark);
      transform: translateY(-1px);
    }

    .btn-blue {
      background: var(--secondary);
    }

    .btn-blue:hover {
      background: #1d4ed8;
    }

    .btn-light {
      background: #e2e8f0;
      color: #334155;
    }

    .btn-light:hover {
      background: #cbd5e1;
    }

    .section-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .section-heading h3 {
      margin-bottom: 0;
    }

    .feed {
      margin-top: 20px;
    }

    .disc-item {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 16px;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(5px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .disc-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 12px;
    }

    .disc-name {
      font-weight: 800;
      font-size: 14px;
      color: #1e293b;
    }

    .disc-time {
      font-size: 11px;
      color: var(--muted);
      margin-top: 4px;
    }

    .disc-message {
      margin: 15px 0;
      line-height: 1.7;
      font-size: 14px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      color: #334155;
    }

    .disc-replies {
      background: #eff6ff;
      border-left: 4px solid #3b82f6;
      padding: 13px;
      border-radius: 8px;
      margin-bottom: 14px;
      font-size: 13px;
      line-height: 1.7;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .reply-form {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 8px;
      align-items: center;
    }

    .reply-form input {
      min-width: 0;
      padding: 10px;
      font-size: 12px;
    }

    .reply-form .btn {
      padding: 10px 13px;
      white-space: nowrap;
    }

    .empty-state,
    .loading-state {
      text-align: center;
      color: var(--muted);
      padding: 30px 10px;
      font-size: 14px;
    }

    .spinner {
      display: inline-block;
      width: 17px;
      height: 17px;
      border: 2px solid rgba(255, 255, 255, 0.4);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .toast-container {
      position: fixed;
      bottom: 20px;
      right: 20px;
      left: 20px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      pointer-events: none;
      z-index: 1000;
    }

    .toast {
      max-width: 380px;
      background: #0f172a;
      color: white;
      padding: 13px 17px;
      border-radius: 10px;
      margin-top: 8px;
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 13px;
      box-shadow: var(--shadow);
      animation: toastIn 0.25s ease;
    }

    .toast.success {
      background: #059669;
    }

    .toast.error {
      background: #dc2626;
    }

    @keyframes toastIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .translation-note {
      color: var(--muted);
      font-size: 11px;
      margin-top: 8px;
      font-style: italic;
    }

    @media (max-width: 650px) {
      body {
        padding: 10px;
      }

      .card {
        padding: 17px;
        border-radius: 14px;
      }

      .header-top {
        align-items: stretch;
      }

      .language-box {
        width: 100%;
      }

      .reply-form {
        grid-template-columns: 1fr;
      }

      .reply-form .btn {
        width: 100%;
      }

      .disc-header {
        flex-direction: column;
      }

      .toast-container {
        align-items: stretch;
      }

      .toast {
        max-width: none;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- HEADER -->
    <div class="header card">
      <div class="header-top">

        <div>
          <span class="brand-tag">NASHO HEALTH CENTER</span>

          <h1 data-i18n="title">
            NASHO HEALTH CENTER
          </h1>

          <p class="subtitle" data-i18n="subtitle">
            Ibiganiro Byihariye
          </p>
        </div>

        <div class="language-box">
          <label for="languageSelect" data-i18n="languageLabel">
            Ururimi
          </label>

          <select id="languageSelect" onchange="changeLanguage(this.value)">
            <option value="rw">🇷🇼 Kinyarwanda</option>
            <option value="en">🇬🇧 English</option>
            <option value="fr">🇫🇷 Français</option>
          </select>
        </div>

      </div>
    </div>

    <!-- NEW MESSAGE -->
    <div class="card">

      <h3 data-i18n="newMessage">
        Ohereza Ubutumwa Bushya
      </h3>

      <form id="postForm">

        <div class="form-group">
          <label for="senderName" data-i18n="names">
            Amazina yawe *
          </label>

          <input
            type="text"
            id="senderName"
            required
            maxlength="100"
            placeholder="Urugero: Jean Pierre"
          >
        </div>

        <div class="form-group">
          <label for="senderPhone" data-i18n="phone">
            Telefone *
          </label>

          <input
            type="tel"
            id="senderPhone"
            required
            maxlength="30"
            placeholder="0788 000 000"
          >
        </div>

        <div class="form-group">
          <label for="senderMessage" data-i18n="message">
            Ubutumwa *
          </label>

          <textarea
            id="senderMessage"
            rows="4"
            required
            maxlength="5000"
            placeholder="Andika ubutumwa bwawe hano..."
          ></textarea>
        </div>

        <button type="submit" class="btn" id="btnPost">
          <i data-lucide="send" width="16"></i>
          <span data-i18n="send">Ohereza</span>
        </button>

      </form>

    </div>

    <!-- DISCUSSIONS -->
    <div class="card">

      <div class="section-heading">

        <h3 data-i18n="discussions">
          Ibiganiro Byatanzwe
        </h3>

        <button class="btn btn-blue" id="btnRefresh" onclick="loadDiscussions()">
          <i data-lucide="refresh-cw" width="16"></i>
          <span data-i18n="refresh">Vugurura</span>
        </button>

      </div>

      <div id="feed" class="feed">
        <div class="loading-state">
          Turimo gushaka ubutumwa muri Sheets...
        </div>
      </div>

    </div>

  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script>
    const API_URL =
      "https://script.google.com/macros/s/AKfycbypGPs7EwMgmFAbSpxj4auBZtnVbNNHTGMuRtF6BFa9vBT8R6iZ4xccNS5sBQRNgm5c/exec";

    let discussions = [];
    let currentLanguage =
      localStorage.getItem("nashoLanguage") || "rw";

    let renderVersion = 0;
    const translationCache = new Map();

    const translations = {
      rw: {
        title: "NASHO HEALTH CENTER",
        subtitle: "Ibiganiro Byihariye",
        languageLabel: "Ururimi",
        newMessage: "Ohereza Ubutumwa Bushya",
        names: "Amazina yawe *",
        phone: "Telefone *",
        message: "Ubutumwa *",
        send: "Ohereza",
        discussions: "Ibiganiro Byatanzwe",
        refresh: "Vugurura",
        noMessages: "Nta butumwa buratangwa.",
        replyTitle: "Ibisubizo Byatanzwe:",
        replyName: "Izina ryawe (Umusubiza)...",
        replyText: "Andika igisubizo hano...",
        reply: "Subiza",
        sending: "Kohereza...",
        translating: "Turimo guhindura ubutumwa...",
        loading: "Turimo gushaka ubutumwa muri Sheets...",
        translateNote: "Ubutumwa bwahinduwe mu rurimi wahisemo."
      },

      en: {
        title: "NASHO HEALTH CENTER",
        subtitle: "Private Discussions",
        languageLabel: "Language",
        newMessage: "Send a New Message",
        names: "Your Name *",
        phone: "Phone Number *",
        message: "Message *",
        send: "Send",
        discussions: "Posted Discussions",
        refresh: "Refresh",
        noMessages: "No messages yet.",
        replyTitle: "Replies:",
        replyName: "Your Name (Reply)...",
        replyText: "Write your reply here...",
        reply: "Reply",
        sending: "Sending...",
        translating: "Translating messages...",
        loading: "Loading messages from Sheets...",
        translateNote: "Message translated into your selected language."
      },

      fr: {
        title: "NASHO HEALTH CENTER",
        subtitle: "Discussions privées",
        languageLabel: "Langue",
        newMessage: "Envoyer un nouveau message",
        names: "Votre nom *",
        phone: "Téléphone *",
        message: "Message *",
        send: "Envoyer",
        discussions: "Discussions publiées",
        refresh: "Actualiser",
        noMessages: "Aucun message pour le moment.",
        replyTitle: "Réponses :",
        replyName: "Votre nom (réponse)...",
        replyText: "Écrivez votre réponse ici...",
        reply: "Répondre",
        sending: "Envoi...",
        translating: "Traduction des messages...",
        loading: "Chargement des messages depuis Sheets...",
        translateNote: "Message traduit dans la langue sélectionnée."
      }
    };

    function t(key) {
      return translations[currentLanguage]?.[key]
        || translations.rw[key]
        || key;
    }

    function escapeHtml(value) {
      if (value === null || value === undefined) return "";

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function escapeAttribute(value) {
      return escapeHtml(value);
    }

    function showToast(message, type = "info") {
      const container = document.getElementById("toastContainer");

      const toast = document.createElement("div");
      toast.className = `toast ${type}`;

      const icon = document.createElement("i");
      icon.setAttribute(
        "data-lucide",
        type === "error" ? "alert-circle" : "check-circle"
      );

      const span = document.createElement("span");
      span.textContent = message;

      toast.appendChild(icon);
      toast.appendChild(span);
      container.appendChild(toast);

      lucide.createIcons();

      setTimeout(() => toast.remove(), 4500);
    }

    function setButtonLoading(button, loading, text) {
      button.disabled = loading;

      if (loading) {
        button.innerHTML = `
          <span class="spinner"></span>
          <span>${escapeHtml(text)}</span>
        `;
      } else {
        button.innerHTML = `
          <i data-lucide="send" width="16"></i>
          <span>${escapeHtml(t("send"))}</span>
        `;

        lucide.createIcons();
      }
    }

    function updateInterfaceLanguage() {
      document.documentElement.lang = currentLanguage;

      document.querySelectorAll("[data-i18n]").forEach(el => {
        const key = el.dataset.i18n;
        el.textContent = t(key);
      });

      document.getElementById("languageSelect").value =
        currentLanguage;

      document.getElementById("senderName").placeholder =
        currentLanguage === "en"
          ? "Example: Jean Pierre"
          : currentLanguage === "fr"
            ? "Exemple : Jean Pierre"
            : "Urugero: Jean Pierre";

      document.getElementById("senderMessage").placeholder =
        currentLanguage === "en"
          ? "Write your message here..."
          : currentLanguage === "fr"
            ? "Écrivez votre message ici..."
            : "Andika ubutumwa bwawe hano...";
    }

    function changeLanguage(language) {
      if (!translations[language]) return;

      currentLanguage = language;

      localStorage.setItem("nashoLanguage", language);

      updateInterfaceLanguage();
      renderFeed();
    }

    /*
      JSONP REQUEST
      Ikoreshwa kuri Google Apps Script endpoint
    */

    function fetchGasJsonp(params) {
      return new Promise((resolve, reject) => {
        const cbName =
          "nashoCb_" +
          Date.now() +
          "_" +
          Math.random().toString(36).slice(2);

        const script = document.createElement("script");

        const query = new URLSearchParams();

        Object.entries(params).forEach(([key, value]) => {
          query.set(key, String(value ?? ""));
        });

        query.set("callback", cbName);

        let done = false;

        const timer = setTimeout(() => {
          if (!done) {
            done = true;
            cleanup();
            reject(new Error("Request timeout"));
          }
        }, 30000);

        function cleanup() {
          clearTimeout(timer);
          script.remove();

          try {
            delete window[cbName];
          } catch (e) {
            window[cbName] = undefined;
          }
        }

        window[cbName] = data => {
          if (done) return;

          done = true;
          cleanup();
          resolve(data);
        };

        script.onerror = () => {
          if (done) return;

          done = true;
          cleanup();
          reject(new Error("Network error"));
        };

        script.src = API_URL + "?" + query.toString();

        document.head.appendChild(script);
      });
    }

    async function loadDiscussions() {
      const feed = document.getElementById("feed");

      feed.innerHTML = `
        <div class="loading-state">
          ${escapeHtml(t("loading"))}
        </div>
      `;

      try {
        const response = await fetchGasJsonp({
          action: "getDiscussions"
        });

        if (response && response.success) {
          discussions = Array.isArray(response.discussions)
            ? response.discussions
            : [];

          renderFeed();
        } else {
          showToast(
            response?.message || "Unable to load discussions.",
            "error"
          );

          feed.innerHTML = `
            <div class="empty-state">
              ${escapeHtml(t("noMessages"))}
            </div>
          `;
        }

      } catch (error) {
        console.error(error);

        showToast(
          currentLanguage === "rw"
            ? "Ntabwo byakunze kuzana ubutumwa."
            : currentLanguage === "fr"
              ? "Impossible de charger les messages."
              : "Unable to load messages.",
          "error"
        );

        feed.innerHTML = `
          <div class="empty-state">
            ${escapeHtml(t("noMessages"))}
          </div>
        `;
      }
    }

    async function translateText(text, targetLanguage) {
      if (!text || targetLanguage === "rw") return text;

      const cacheKey = `${targetLanguage}:${text}`;

      if (translationCache.has(cacheKey)) {
        return translationCache.get(cacheKey);
      }

      try {
        const result = await fetchGasJsonp({
          action: "translateText",
          text: text,
          targetLanguage: targetLanguage
        });

        if (result && result.success && result.translation) {
          translationCache.set(cacheKey, result.translation);
          return result.translation;
        }

        return text;

      } catch (error) {
        console.error("Translation error:", error);
        return text;
      }
    }

    async function translateDiscussion(discussion) {
      if (currentLanguage === "rw") {
        return {
          ...discussion,
          translatedMessage: discussion.message || "",
          translatedReply: discussion.reply || ""
        };
      }

      const [message, reply] = await Promise.all([
        translateText(discussion.message || "", currentLanguage),
        translateText(discussion.reply || "", currentLanguage)
      ]);

      return {
        ...discussion,
        translatedMessage: message,
        translatedReply: reply
      };
    }

    async function renderFeed() {
      const feed = document.getElementById("feed");
      const version = ++renderVersion;

      if (!discussions.length) {
        feed.innerHTML = `
          <div class="empty-state">
            ${escapeHtml(t("noMessages"))}
          </div>
        `;

        return;
      }

      feed.innerHTML = `
        <div class="loading-state">
          ${escapeHtml(t("translating"))}
        </div>
      `;

      const translatedDiscussions = await Promise.all(
        discussions.map(d => translateDiscussion(d))
      );

      if (version !== renderVersion) return;

      feed.innerHTML = translatedDiscussions.map(d => {
        const message = d.translatedMessage || d.message || "";
        const reply = d.translatedReply || d.reply || "";

        const hasReply = reply.trim() !== "";

        const id = escapeAttribute(d.id);

        return `
          <div class="disc-item">

            <div class="disc-header">
              <div>
                <div class="disc-name">
                  ${escapeHtml(d.name)}
                </div>

                <div class="disc-time">
                  ${escapeHtml(d.phone)}
                </div>
              </div>

              <div class="disc-time">
                ${escapeHtml(d.timestamp)}
              </div>
            </div>

            <div class="disc-message">
              ${escapeHtml(message)}
            </div>

            ${
              hasReply
                ? `
                  <div class="disc-replies">
                    <strong>${escapeHtml(t("replyTitle"))}</strong>
                    <br>
                    ${escapeHtml(reply)}
                  </div>
                `
                : ""
            }

            <div class="reply-form">

              <input
                type="text"
                id="replyName_${id}"
                maxlength="100"
                placeholder="${escapeAttribute(t("replyName"))}"
              >

              <input
                type="text"
                id="replyText_${id}"
                maxlength="3000"
                placeholder="${escapeAttribute(t("replyText"))}"
              >

              <button
                class="btn"
                type="button"
                onclick="replyMessage('${id}')"
              >
                ${escapeHtml(t("reply"))}
              </button>

            </div>

          </div>
        `;
      }).join("");

      lucide.createIcons();
    }

    document.getElementById("postForm").addEventListener("submit", postMessage);

    async function postMessage(event) {
      event.preventDefault();

      const name = document.getElementById("senderName").value.trim();
      const phone = document.getElementById("senderPhone").value.trim();
      const message = document.getElementById("senderMessage").value.trim();

      const button = document.getElementById("btnPost");

      if (!name || !phone || !message) {
        showToast(
          currentLanguage === "rw"
            ? "Uzuza ibisabwa byose."
            : currentLanguage === "fr"
              ? "Veuillez remplir tous les champs obligatoires."
              : "Please fill in all required fields.",
          "error"
        );

        return;
      }

      if (message.length > 5000) {
        showToast("Message is too long.", "error");
        return;
      }

      setButtonLoading(button, true, t("sending"));

      try {
        const response = await fetchGasJsonp({
          action: "postDiscussion",
          name: name,
          phone: phone,
          message: message
        });

        if (response && response.success) {
          showToast(
            currentLanguage === "rw"
              ? "Ubutumwa bwoherejwe neza!"
              : currentLanguage === "fr"
                ? "Votre message a été envoyé."
                : "Your message was sent successfully.",
            "success"
          );

          document.getElementById("senderMessage").value = "";

          await loadDiscussions();

        } else {
          showToast(
            response?.message || "Unable to send message.",
            "error"
          );
        }

      } catch (error) {
        console.error(error);
        showToast(
          currentLanguage === "rw"
            ? "Byanze kohereza ubutumwa."
            : currentLanguage === "fr"
              ? "Échec de l'envoi du message."
              : "Failed to send message.",
          "error"
        );
      } finally {
        setButtonLoading(button, false, t("send"));
      }
    }

    async function replyMessage(discId) {
      const nameInput = document.getElementById("replyName_" + discId);
      const textInput = document.getElementById("replyText_" + discId);

      if (!nameInput || !textInput) return;

      const name = nameInput.value.trim();
      const text = textInput.value.trim();

      if (!name || !text) {
        showToast(
          currentLanguage === "rw"
            ? "Banza wandike izina n'igisubizo."
            : currentLanguage === "fr"
              ? "Veuillez saisir votre nom et votre réponse."
              : "Please enter your name and reply.",
          "error"
        );

        return;
      }

      if (text.length > 3000) {
        showToast("Reply is too long.", "error");
        return;
      }

      const target = discussions.find(
        d => String(d.id) === String(discId)
      );

      if (!target) {
        showToast("Discussion not found.", "error");
        return;
      }

      const appendedReply = `[${name}]: ${text}`;

      const fullReply = target.reply
        ? target.reply + "\n\n" + appendedReply
        : appendedReply;

      try {
        const response = await fetchGasJsonp({
          action: "replyDiscussion",
          id: discId,
          reply: fullReply,
          replyName: name
        });

        if (response && response.success) {
          showToast(
            currentLanguage === "rw"
              ? "Igisubizo cyoherejwe neza!"
              : currentLanguage === "fr"
                ? "Réponse envoyée avec succès."
                : "Reply sent successfully.",
            "success"
          );

          await loadDiscussions();

        } else {
          showToast(
            response?.message || "Unable to send reply.",
            "error"
          );
        }

      } catch (error) {
        console.error(error);

        showToast(
          currentLanguage === "rw"
            ? "Byanze kohereza igisubizo."
            : currentLanguage === "fr"
              ? "Échec de l'envoi de la réponse."
              : "Failed to send reply.",
          "error"
        );
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById("languageSelect").value =
        currentLanguage;

      updateInterfaceLanguage();
      lucide.createIcons();
      loadDiscussions();
    });
  </script>

</body>
</html>
